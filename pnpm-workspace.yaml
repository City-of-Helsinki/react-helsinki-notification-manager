packages:
  - '.'

# Don't allow dependencies to be used before they have been released for at least 1 week
minimumReleaseAge: 10080

# Use minimumReleaseAgeExclude temporarily for emergency security vulnerability fixes
#minimumReleaseAgeExclude:

allowBuilds:
  '@parcel/watcher': true
  unrs-resolver: true

overrides:
  # hds-react 5 depends on @typescript-eslint/parser 6, which pins a
  # vulnerable minimatch 9.0.3. Can be removed with hds-react 6.
  '@typescript-eslint/typescript-estree@6>minimatch': '^9.0.9'
