# .github/workflows/release-please.yml
name: release-please
on:
  push:
    branches:
      - main
  schedule:
    - cron: '1 0 * * *'

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    uses: City-of-Helsinki/.github/.github/workflows/release-please.yml@main
  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    uses: City-of-Helsinki/.github/.github/workflows/ci-pnpm-node.yml@main
    with:
      node-version: '22'
      upload-artifacts: true
      skip-sonar: true
  publish:
    needs: build
    uses: City-of-Helsinki/.github/.github/workflows/ci-npm-publish.yml@main
    with:
      node-version: '22'
      use-ci-build: true
